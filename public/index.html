<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24272c">
  <meta name="description" content="4blade — Gestão afiada para sua barbearia.">
  <title>4blade</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-v2.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="4blade">
  <script src="/tema.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topo">
    <button type="button" class="btn-menu" id="btn-menu" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false" hidden></button>
    <a class="topo-logo" href="#/" aria-label="4blade — início"><img src="/icons/logo.png" alt="4blade" width="86" height="35"></a>
    <div class="topo-textos">
      <p class="sub" id="topo-sub"></p>
    </div>
    <nav class="topo-acoes" id="topo-acoes" hidden>
      <button type="button" class="topo-conta" id="btn-conta" aria-haspopup="dialog">Minha conta</button>
    </nav>
  </header>
  <aside class="menu-lateral" id="menu" aria-label="Menu" hidden></aside>
  <div class="fundo-menu" id="fundo-menu" hidden></div>
  <main id="app" tabindex="-1"></main>
  <div class="carregador inicial" id="carregador" role="status" aria-live="polite">
    <div class="carregador-centro">
      <div class="carregador-simbolo" aria-hidden="true">
        <span class="carregador-anel"></span>
        <img src="/icons/marca.png" alt="" width="64" height="64">
      </div>
      <img class="carregador-logo" src="/icons/logo.png" alt="4blade" width="240" height="98">
      <p class="carregador-frase">Gestão <span>afiada</span> para sua barbearia.</p>
      <p class="carregador-texto">Carregando…</p>
    </div>
  </div>
  <div class="aviso-flutuante" id="aviso" role="status" aria-live="polite" hidden></div>
  <dialog id="janela" class="janela"></dialog>
</body>
</html>
