# 4blade — VERSÃO DE TESTE na Cloudflare (dados fictícios). Separada da versão real (wrangler.toml).
# Publicar: npx wrangler deploy --config wrangler.teste.toml
# Migrações: npx wrangler d1 migrations apply 4blade-db-teste --remote --config wrangler.teste.toml
name = "4blade-teste"
main = "src/index.js"
compatibility_date = "2026-01-01"
keep_vars = true
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "4blade-db-teste"
database_id = "PREENCHER-AO-CRIAR"
migrations_dir = "migrations"
