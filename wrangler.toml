# 4blade — VERSÃO OFICIAL na Cloudflare (dados REAIS das barbearias). Separada da versão de teste (wrangler.teste.toml).
# Publicar:   npx wrangler deploy                       (só com autorização do responsável)
# Migrações:  npx wrangler d1 migrations apply 4blade-db --remote   (banco REAL: só com autorização; migrações nunca apagam dados)
# A tela (public/) vai DENTRO do Worker (src/entrada-teste.js), como na versão de teste: o envio de "assets"
# não passa pelo proxy do ambiente do Claude. Mesmos cabeçalhos de segurança de public/_headers.
name = "4blade"
main = "src/entrada-teste.js"
compatibility_date = "2026-01-01"
keep_vars = true
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/public/*.js", "**/*.json", "**/*.svg", "**/_headers"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "4blade-db"
database_id = "e59dc06b-cf90-4e67-bc06-710165e45d5a"
migrations_dir = "migrations"

# Fotos da Página da Barbearia (logo, capa, galeria, equipe). Criado em 24/11/2026 (autorizado). Servidas em /f/<id>.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "4blade-fotos"
