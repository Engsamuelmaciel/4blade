# 4blade — Worker da Cloudflare (API em /api/* + tela da pasta public/).
# ATENÇÃO: os ids abaixo são MARCADORES. Nenhum recurso foi criado na Cloudflare.
# Antes do primeiro deploy (com autorização do responsável), crie os recursos e troque os ids:
#   npx wrangler d1 create 4blade-db          -> copie o "database_id"
#   npx wrangler d1 create 4blade-db-teste    -> banco separado para as prévias
#   npx wrangler secret put ADMIN_SETUP_TOKEN  -> segredo para criar o 1º usuário da plataforma
name = "4blade"
main = "src/index.js"
compatibility_date = "2026-01-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "4blade-db"
database_id = "TROQUE-PELO-ID-DO-SEU-BANCO"
migrations_dir = "migrations"

# Prévias de ramificações usam SEMPRE um banco de TESTE separado. Nunca apontar para o banco real aqui.
[[previews.d1_databases]]
binding = "DB"
database_name = "4blade-db-teste"
database_id = "TROQUE-PELO-ID-DO-BANCO-DE-TESTE"
migrations_dir = "migrations"
